# Bert: database, API, worker, web server and backup. Start with install.sh, manage with ./epaper.
name: bert

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"   # keeps the SD card from filling up with logs
    max-file: "3"

x-backend: &backend
  image: bert-backend:local
  restart: unless-stopped
  env_file: .env
  environment:
    TZ: ${TZ:-Europe/Berlin}
    DATABASE_URL: mysql+pymysql://epaper:${DB_PASSWORD}@db:3306/epaper
    IMAGE_DIR: /data/images
    FIRMWARE_DIR: /data/firmware_bins
    CA_B64_FILE: /certs/ca.b64
  volumes:
    - images:/data/images
    - firmware:/data/firmware_bins
    - ./certs/public:/certs:ro          # only the public part, never the keys
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    env_file: .env.db
    environment:
      TZ: ${TZ:-Europe/Berlin}
      MARIADB_DATABASE: epaper
      MARIADB_USER: epaper
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *logging
    # No published ports: only the other containers can reach the database.

  api:
    <<: *backend
    build:
      context: .
      dockerfile: backend/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  worker:
    <<: *backend
    command: ["python", "worker.py"]
    depends_on:
      api:
        condition: service_healthy   # the API applies the database migrations first

  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./web/admin:/usr/share/nginx/html/admin:ro
      - ./certs/server:/etc/nginx/certs:ro
      - ./certs/public:/usr/share/nginx/html/pki:ro
    logging: *logging

  backup:
    image: mariadb:10.11
    restart: unless-stopped
    env_file: .env.db
    environment:
      TZ: ${TZ:-Europe/Berlin}
      BACKUP_KEEP_DAYS: "14"
      BACKUP_HOUR: "3"
    entrypoint: ["/bin/bash", "/backup-loop.sh"]
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./deploy/backup-loop.sh:/backup-loop.sh:ro
      - ./backups:/backups
    logging: *logging

volumes:
  db-data:
  images:
  firmware: