; Build with:  pio run            (binary: .pio/build/<env>/firmware.bin)
; Flash with:  pio run -t upload
; Monitor:     pio device monitor

[platformio]
default_envs = waveshare_esp32

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_echo = yes   ; show typed characters in the serial monitor
lib_deps =
    bblanchon/ArduinoJson@^7.2.1

; Development board (Waveshare e-Paper ESP32 driver board)
[env:waveshare_esp32]
board = esp32dev

; Seeed XIAO ePaper Display Board EE05 (XIAO ESP32-S3 Plus). Check the board id
; against the PlatformIO board list before the first build.
[env:xiao_ee05]
board = seeed_xiao_esp32s3
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1