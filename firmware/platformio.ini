; Build with:  pio run            (binary: .pio/build/<env>/firmware.bin)
; Flash with:  pio run -t upload
; Monitor:     pio device monitor

[platformio]
default_envs = waveshare_esp32

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_echo = yes   ; show typed characters in the serial monitor
lib_deps =
    bblanchon/ArduinoJson@^7.2.1
    zinggjm/GxEPD2@^1.6.0

; Development board (Waveshare e-Paper ESP32 driver board)
[env:waveshare_esp32]
board = esp32dev
build_flags = -DBOARD_WAVESHARE_ESP32

; Seeed XIAO ePaper Display Board EE05 (XIAO ESP32-S3 Plus). Check the board id
; against the PlatformIO board list and set the display pins in config.h before building.
[env:xiao_ee05]
board = seeed_xiao_esp32s3
build_flags =
    -DBOARD_XIAO_EE05
    -DARDUINO_USB_CDC_ON_BOOT=1

; Test build for the update rollback: crashes on purpose right after the start.
; Raise FW_VERSION in src/config.h before building it, install it via OTA and check that the
; device goes back to the previous firmware by itself. Never flash this one for real use.
[env:waveshare_esp32_crashtest]
board = esp32dev
build_flags =
    -DBOARD_WAVESHARE_ESP32
    -DOTA_TEST_CRASH