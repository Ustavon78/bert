# nginx for Bert: HTTPS, static admin page, proxy to the API.

limit_req_zone $binary_remote_addr zone=bert_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=bert_admin:10m rate=5r/s;

# Plain HTTP only redirects, and offers the CA certificate (needed once to trust the HTTPS).
server {
    listen 80;
    server_name _;

    location /pki/ {
        root /usr/share/nginx/html;
        types { application/x-x509-ca-cert crt; text/plain b64; }
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 5m;            # firmware upload
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location = / {
        return 302 /admin/;
    }

    # The admin page is static. The data comes from /api/admin, which asks for the login.
    location /admin/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /admin/index.html;
        add_header Cache-Control "no-cache" always;
        # Optional: only allow the admin PC.
        # allow 192.168.1.50;
        # deny all;
    }

    location /pki/ {
        root /usr/share/nginx/html;
        types { application/x-x509-ca-cert crt; text/plain b64; }
    }

    location /api/admin/ {
        limit_req zone=bert_admin burst=20 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        limit_req zone=bert_api burst=60 nodelay;
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}